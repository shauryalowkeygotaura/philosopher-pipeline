name: Quote Pool Maintenance

# Keeps the quote supply stocked without anyone running a script.
#
# Deliberately a SEPARATE workflow from pipeline.yml:
#   - a slow or failing top-up must never delay or break a reel
#   - it commits only philosophers.md + runs/, so it cannot race the reel job
#     over state.json
#   - it can be re-run on its own when the pool needs attention
#
# Sunday 04:00 UTC (09:30 IST) puts it before the week's first cron slot
# (Tue 03:30 UTC), so the pool is stocked ahead of demand rather than after.

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "Desired unpublished quotes per philosopher"
        default: "8"
      min_runway:
        description: "Promote a new philosopher below this TOTAL runway"
        default: "40"

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # The import chain is maintain_pool -> quotes -> fetcher, and fetcher
      # imports requests at module scope. Installing only `groq` here broke
      # every run from 2026-08-09 to 2026-08-23 with ModuleNotFoundError.
      # Still deliberately not requirements.txt: this job never renders a reel,
      # so it should not pay for Pillow/librosa/instagrapi. If you add a
      # third-party import anywhere in that chain, add it here too.
      - name: Install dependencies
        run: pip install groq requests

      - name: Top up the quote pool
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Keys from OTHER Groq accounts. Groq meters per
          # organisation, so only a different account adds quota.
          # Unset secrets expand to empty and are ignored.
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
        run: |
          # Last run's pool_status.json is committed to the repo. If this step
          # crashes, a stale file would let the report step below announce
          # "Pool healthy" for a run that never happened, which is exactly what
          # masked the ModuleNotFoundError for two weeks.
          rm -f runs/pool_status.json
          python scripts/maintain_pool.py \
            --target "${{ github.event.inputs.target || '8' }}" \
            --min-runway "${{ github.event.inputs.min_runway || '40' }}"

      - name: Commit the restocked pool
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # philosophers.md changes only when a promotion happened.
          git add philosophers.md runs/
          git diff --cached --quiet || git commit -m "chore: restock quote pool [skip ci]"
          git push

      # One notification channel for BOTH failure shapes: the pool starved, or
      # the run never completed. A silently-failing maintenance job is the same
      # class of bug as the silent [0] fallback this system exists to prevent,
      # so it must reach a human either way.
      - name: Report pool problems
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          notify() {  # $1 = issue title, $2 = body file
            gh label create quote-pool --color B60205 --description "Quote supply needs attention" 2>/dev/null || true
            EXISTING=$(gh issue list --state open --label quote-pool --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body-file "$2"
            else
              gh issue create --title "$1" --label quote-pool --body-file "$2"
            fi
          }

          # The status file is removed before the top-up step, so its absence
          # here means that step crashed, never that the pool is fine.
          if [ ! -f runs/pool_status.json ]; then
            {
              echo "Quote pool maintenance failed before writing a status file."
              echo ""
              echo "Run: $RUN_URL"
              echo ""
              echo "The pool was NOT restocked. Reels keep shipping from the"
              echo "existing buffer and fall back to LRU spaced replay once it"
              echo "empties, so this degrades quietly rather than breaking."
              echo ""
              echo "Check the 'Top up the quote pool' step log. A missing"
              echo "third-party import is the known cause: this job installs"
              echo "only groq + requests, so any new import in the"
              echo "maintain_pool -> quotes -> fetcher chain must be added to"
              echo "the install step."
            } > issue_body.md
            notify "Quote pool maintenance failed" issue_body.md
            exit 1
          fi

          python - <<'PY' > issue_body.md
          import json, os, pathlib
          s = json.loads(pathlib.Path("runs/pool_status.json").read_text(encoding="utf-8"))
          starved = s.get("starved") or []
          out = []
          out.append("Run: " + os.environ.get("RUN_URL", ""))
          out.append("")
          out.append("Total runway: **%s** (threshold %s)" % (s.get("total_runway"), s.get("min_runway")))
          out.append("Quotes added this run: %s" % s.get("quotes_added"))
          out.append("Promoted: %s" % (", ".join(s.get("promoted") or []) or "nobody"))
          out.append("Groq calls: %s of %s" % (s.get("calls_used"), s.get("call_budget")))
          if s.get("rate_limited"):
              out.append("")
              out.append("**Groq quota was exhausted mid-run** (free tier is 200k tokens/day).")
              out.append("The run stopped early and kept what it had generated. Lower")
              out.append("--max-calls, or spread the sweep across more days.")
          out.append("")
          out.append("## Out of fresh quotes")
          out.extend("- " + n for n in starved)
          tapped = s.get("tapped_out") or []
          if tapped:
              out.append("")
              out.append("## Tapped out (still hold quotes, but produce no new ones)")
              out.extend("- " + n for n in tapped)
          out.append("")
          out.append("These republish an earlier quote via LRU spaced replay until restocked.")
          out.append("")
          out.append("The generator could not produce verified quotes for them. Either the")
          out.append("attribution gate is rejecting everything (check the run log), or the")
          out.append("model is out of documented material for that thinker, in which case")
          out.append("promote a replacement from roster.py.")
          print(chr(10).join(out))
          pathlib.Path("starved.flag").write_text("1" if starved else "")
          PY

          if [ -s starved.flag ]; then
            NAMES=$(python -c "import json;print(', '.join(json.load(open('runs/pool_status.json'))['starved']))")
            notify "Quote pool starving: $NAMES" issue_body.md
          elif python -c "import json,sys; sys.exit(0 if json.load(open('runs/pool_status.json')).get('rate_limited') else 1)"; then
            notify "Quote pool: Groq quota exhausted mid-run" issue_body.md
          else
            echo "Pool healthy - nothing to report."
          fi
