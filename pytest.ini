[pytest]
# Scope collection to tests/ deliberately.
#
# pytest's default python_files glob is BOTH "test_*.py" and "*_test.py", and
# collection *imports* every file it matches. scripts/upload_kinetic_v2_test.py
# is a hand-run publishing script that calls upload_reel() at module level, so
# an unscoped `pytest` at the repo root posts a real reel to Instagram during
# collection -- before a single test runs. It fails locally only because
# INSTAGRAM_USERNAME/PASSWORD are absent; anywhere those are set (CI, a machine
# with .env) the suite would publish.
#
# testpaths keeps a bare `pytest` inside tests/; dropping "*_test.py" from
# python_files means an explicit `pytest scripts/` cannot resurrect it either.
testpaths = tests
python_files = test_*.py
